controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    x_axis_position_controller:
      type: position_controllers/JointGroupPositionController

    y_axis_position_controller:
      type: position_controllers/JointGroupPositionController

    z_axis_position_controller:
      type: position_controllers/JointGroupPositionController

    x_axis_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    y_axis_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    z_axis_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50

joint_trajectory_controller:
  ros__parameters:
    joints:
      - x_axis_joint
      - y_axis_joint
      - z_axis_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 5.0

x_axis_position_controller:
  ros__parameters:
    joints:
      - x_axis_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

y_axis_position_controller:
  ros__parameters:
    joints:
      - y_axis_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

z_axis_position_controller:
  ros__parameters:
    joints:
      - z_axis_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

x_axis_velocity_controller:
  ros__parameters:
    joints:
      - x_axis_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

y_axis_velocity_controller:
  ros__parameters:
    joints:
      - y_axis_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

z_axis_velocity_controller:
  ros__parameters:
    joints:
      - z_axis_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
